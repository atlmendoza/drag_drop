<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UML Relationships Table Drag & Drop</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .status {
      text-align: center;
      margin: 15px 0;
      font-size: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 2px solid #ccc;
      padding: 10px;
      text-align: center;
      min-height: 50px;
    }
    th {
      background-color: #0078d7;
      color: white;
    }
    .draggable {
      background-color: #0078d7;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      margin: 5px;
      cursor: grab;
      display: inline-block;
    }
    td.over {
      background-color: #e8f0fe;
      border-color: #0078d7;
    }
    #resetBtn {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Drag & Drop: Complete the UML Relationships Table</h1>

  <div class="status">
    ⏱ Time Left: <span id="timer">90</span>s | ✅ Score: <span id="score">0</span>/16
  </div>

  <!-- Table with empty cells -->
  <table>
    <tr>
      <th>Relationship</th>
      <th>Definition</th>
      <th>UML Notation</th>
      <th>Lifecycle</th>
      <th>Example</th>
    </tr>
    <tr>
      <td>Composition</td>
      <td class="drop" data-match="composition-def"></td>
      <td class="drop" data-match="composition-uml"></td>
      <td class="drop" data-match="composition-life"></td>
      <td class="drop" data-match="composition-ex"></td>
    </tr>
    <tr>
      <td>Aggregation</td>
      <td class="drop" data-match="aggregation-def"></td>
      <td class="drop" data-match="aggregation-uml"></td>
      <td class="drop" data-match="aggregation-life"></td>
      <td class="drop" data-match="aggregation-ex"></td>
    </tr>
    <tr>
      <td>Inheritance</td>
      <td class="drop" data-match="inheritance-def"></td>
      <td class="drop" data-match="inheritance-uml"></td>
      <td class="drop" data-match="inheritance-life"></td>
      <td class="drop" data-match="inheritance-ex"></td>
    </tr>
    <tr>
      <td>Dependency</td>
      <td class="drop" data-match="dependency-def"></td>
      <td class="drop" data-match="dependency-uml"></td>
      <td class="drop" data-match="dependency-life"></td>
      <td class="drop" data-match="dependency-ex"></td>
    </tr>
  </table>

  <!-- Draggable items -->
  <div id="items">
    <h3>🧩 Drag these into the table
