<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identify UML Relationships in Python</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #333; }
    .status { text-align: center; margin: 15px 0; font-size: 18px; }
    .container { display: flex; flex-wrap: wrap; justify-content: space-around; }
    .snippet { width: 45%; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin: 10px; padding: 15px; }
    pre { background: #272822; color: #f8f8f2; padding: 10px; border-radius: 6px; overflow-x: auto; }
    .drop { border: 2px dashed #ccc; border-radius: 6px; padding: 10px; margin-top: 10px; min-height: 40px; text-align: center; }
    .drop.over { background-color: #e8f0fe; border-color: #0078d7; }
    .tiles { text-align: center; margin-top: 20px; }
    .draggable { background-color: #0078d7; color: white; padding: 8px 12px; border-radius: 6px; margin: 5px; cursor: grab; display: inline-block; }
    #resetBtn, #prevBtn { display: block; margin: 20px auto; padding: 10px 20px; background-color: #800000; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Drag & Drop: Identify UML Relationships in Python</h1>

  <div class="status">
    ⏱ Time Left: <span id="timer">90</span>s | ✅ Score: <span id="score">0</span>/4
  </div>

  <div class="container" id="snippetContainer"></div>

  <div class="tiles">
    <h3>🧩 Drag these tiles:</h3>
    <div class="draggable" draggable="true" id="composition">Composition</div>
    <div class="draggable" draggable="true" id="aggregation">Aggregation</div>
    <div class="draggable" draggable="true" id="inheritance">Inheritance</div>
    <div class="draggable" draggable="true" id="dependency">Dependency</div>
  </div>
  <div>
    <button id="resetBtn">Reset</button>
    <button id="prevBtn">Previous</button>
    
  </div>
  <script>
    // --- Define 5 sets of snippets ---
    const sets = [
      // Set 1: Easy
      [
        {id:"composition", code:`class Engine:\n    pass\n\nclass Car:\n    def __init__(self):\n        self.engine = Engine()`},
        {id:"aggregation", code:`class Player:\n    pass\n\nclass Team:\n    def __init__(self, players):\n        self.players = players`},
        {id:"inheritance", code:`class Animal:\n    def __init__(self, name):\n        self.name = name\n\nclass Dog(Animal):\n    def __init__(self, name, breed):\n        super().__init__(name)\n        self.breed = breed`},
        {id:"dependency", code:`class Document:\n    pass\n\nclass Printer:\n    def print_doc(self, doc: Document):\n        print("Printing document")`}
      ],
      // Set 2: Medium
      [
        {id:"composition", code:`class CPU:\n    pass\n\nclass Computer:\n    def __init__(self):\n        self.cpu = CPU()`},
        {id:"aggregation", code:`class Book:\n    pass\n\nclass Library:\n    def __init__(self, books):\n        self.books = books`},
        {id:"inheritance", code:`class Vehicle:\n    def __init__(self, brand):\n        self.brand = brand\n\nclass ElectricCar(Vehicle):\n    def __init__(self, brand, battery):\n        super().__init__(brand)\n        self.battery = battery`},
        {id:"dependency", code:`class Order:\n    pass\n\nclass PaymentProcessor:\n    def process(self, order: Order):\n        print("Processing order")`}
      ],
      // Set 3: Harder
      [
        {id:"composition", code:`class Heart:\n    pass\n\nclass Human:\n    def __init__(self):\n        self.heart = Heart()`},
        {id:"aggregation", code:`class Course:\n    pass\n\nclass Student:\n    def __init__(self, courses):\n        self.courses = courses`},
        {id:"inheritance", code:`class Account:\n    def __init__(self, balance):\n        self.balance = balance\n\nclass SavingsAccount(Account):\n    def __init__(self, balance, interest):\n        super().__init__(balance)\n        self.interest = interest`},
        {id:"dependency", code:`class File:\n    pass\n\nclass FileReader:\n    def read(self, file: File):\n        print("Reading file")`}
      ],
      // Set 4: Advanced
      [
        {id:"composition", code:`class Wheel:\n    pass\n\nclass Bike:\n    def __init__(self):\n        self.front = Wheel()\n        self.back = Wheel()`},
        {id:"aggregation", code:`class Employee:\n    pass\n\nclass Company:\n    def __init__(self, employees):\n        self.employees = employees`},
        {id:"inheritance", code:`class Shape:\n    def __init__(self, color):\n        self.color = color\n\nclass Circle(Shape):\n    def __init__(self, color, radius):\n        super().__init__(color)\n        self.radius = radius`},
        {id:"dependency", code:`class Database:\n    pass\n\nclass QueryRunner:\n    def run(self, db: Database):\n        print("Running query")`}
      ],
      // Set 5: Challenging
      [
        {id:"composition", code:`class Battery:\n    pass\n\nclass Smartphone:\n    def __init__(self):\n        self.battery = Battery()`},
        {id:"aggregation", code:`class Song:\n    pass\n\nclass Playlist:\n    def __init__(self, songs):\n        self.songs = songs`},
        {id:"inheritance", code:`class Person:\n    def __init__(self, name):\n        self.name = name\n\nclass Teacher(Person):\n    def __init__(self, name, subject):\n        super().__init__(name)\n        self.subject = subject`},
        {id:"dependency", code:`class Message:\n    pass\n\nclass Messenger:\n    def send(self, msg: Message):\n        print("Sending message")`}
      ]
    ];

  // Pick random set
  const chosenSet = sets[Math.floor(Math.random() * sets.length)];

  // Shuffle snippets within the set
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }
  shuffle(chosenSet);

  // Render snippets into Snippet 1–4 boxes
  const container = document.getElementById('snippetContainer');
  chosenSet.forEach((snippet, index) => {
    const div = document.createElement('div');
    div.className = 'snippet';
    div.innerHTML = `<h3>Snippet ${index+1}</h3><pre>${snippet.code}</pre><div class="drop" data-match="${snippet.id}">Drop relationship here</div>`;
    container.appendChild(div);
  });

  // Drag logic, random selection of code (5 existing) and random position in the 4 quadrants 
  const draggables = document.querySelectorAll('.draggable');
  const drops = document.querySelectorAll('.drop');
  let draggedItem = null;
  let score = 0;
  let timeLeft = 90;
  let timerInterval;

  draggables.forEach(item => {
    item.addEventListener('dragstart', () => {
      draggedItem = item;
      setTimeout(() => item.style.display = 'none', 0);
    });
    item.addEventListener('dragend', () => {
      setTimeout(() => {
        if (draggedItem) draggedItem.style.display = 'inline-block';
        draggedItem = null;
      }, 0);
    });
  });

  drops.forEach(cell => {
    cell.addEventListener('dragover', e => {
      e.preventDefault();
      cell.classList.add('over');
    });
    cell.addEventListener('dragleave', () => cell.classList.remove('over'));
    cell.addEventListener('drop', () => {
      cell.classList.remove('over');
      if (draggedItem && cell.dataset.match === draggedItem.id) {
        cell.textContent = draggedItem.textContent + " ✅";
        draggedItem.remove();
        score++;
        document.getElementById('score').textContent = score;
        if (score === 4) {
          clearInterval(timerInterval);
          alert("🎉 Excellent! You matched all correctly!");
        }
      } else {
        alert('Incorrect match! Try again.');
      }
    });
  });

  // Timer
  function startTimer() {
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        alert("⏰ Time’s up! Your score: " + score + "/4");
      }
    }, 1000);
  }
  startTimer();

  // Reset
  document.getElementById('resetBtn').addEventListener('click', () => location.reload());
  document.getElementById('prevBtn').addEventListener('click', () => window.open("index.html","_self"));
</script>
